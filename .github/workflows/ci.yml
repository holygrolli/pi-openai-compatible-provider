name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.19.0"
          - "24.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check TypeScript syntax
        run: npm run check

      - name: Verify package contents
        run: npm run check:package

      - name: Install Pi smoke-test CLI
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.84.3

      - name: Verify Pi manifest and offline loading
        env:
          PI_OFFLINE: "1"
        run: pi -e . --list-models
